<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0B0B0C"/>

  <!-- Packaging jar/bottle silhouette — simplified -->
  <!-- Jar body -->
  <rect x="270" y="160" width="260" height="320" fill="#1C81DA" rx="8"/>
  <!-- Jar lid -->
  <rect x="290" y="110" width="220" height="60"  fill="#1C81DA" opacity="0.7"/>
  <!-- Label area on jar -->
  <rect x="290" y="220" width="220" height="160" fill="#0B0B0C" opacity="0.45"/>

  <!-- Botanical line — leaf suggestion -->
  <ellipse cx="400" cy="300" rx="60" ry="40" fill="none" stroke="#ECEAE3" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="260" x2="400" y2="340" stroke="#ECEAE3" stroke-width="1" opacity="0.4"/>
  <line x1="370" y1="290" x2="400" y2="270" stroke="#ECEAE3" stroke-width="0.8" opacity="0.35"/>
  <line x1="430" y1="290" x2="400" y2="270" stroke="#ECEAE3" stroke-width="0.8" opacity="0.35"/>

  <!-- Flanking shapes -->
  <rect x="60"  y="200" width="160" height="240" fill="#1C81DA" opacity="0.15"/>
  <rect x="580" y="200" width="160" height="240" fill="#1C81DA" opacity="0.15"/>

  <!-- Horizontal rules -->
  <line x1="60"  y1="490" x2="740" y2="490" stroke="#1C81DA" stroke-width="1" opacity="0.4"/>
  <line x1="60"  y1="110" x2="740" y2="110" stroke="#1C81DA" stroke-width="1" opacity="0.4"/>

  <!-- Grain overlay -->
  <rect width="800" height="600" fill="#0B0B0C" filter="url(#g)" opacity="0.2"/>

  <!-- Metadata -->
  <text x="60" y="556" font-family="monospace" font-size="10" fill="#ECEAE3" opacity="0.35" letter-spacing="3">003 / PACKAGING / 2025 / REMPAH.CO</text>
</svg>
