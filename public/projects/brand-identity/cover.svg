<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="overlay"/>
    </filter>
    <filter id="h">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0B0B0C"/>

  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#1C81DA" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1C81DA" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#1C81DA" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="0" x2="200" y2="600" stroke="#1C81DA" stroke-width="0.5" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#1C81DA" stroke-width="0.5" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#1C81DA" stroke-width="0.5" opacity="0.3"/>

  <!-- Main shape: solid square block -->
  <rect x="80" y="80" width="260" height="260" fill="#1C81DA"/>

  <!-- Secondary: circle outline -->
  <circle cx="560" cy="300" r="180" fill="none" stroke="#1C81DA" stroke-width="2"/>
  <circle cx="560" cy="300" r="100" fill="none" stroke="#1C81DA" stroke-width="1" opacity="0.5"/>

  <!-- Cross mark -->
  <line x1="460" y1="300" x2="660" y2="300" stroke="#ECEAE3" stroke-width="1" opacity="0.25"/>
  <line x1="560" y1="200" x2="560" y2="400" stroke="#ECEAE3" stroke-width="1" opacity="0.25"/>

  <!-- Diagonal accent -->
  <line x1="80" y1="400" x2="340" y2="560" stroke="#1C81DA" stroke-width="1.5" opacity="0.6"/>

  <!-- Grain overlay -->
  <rect width="800" height="600" fill="#0B0B0C" filter="url(#g)" opacity="0.18"/>

  <!-- Metadata label -->
  <text x="80" y="556" font-family="monospace" font-size="10" fill="#ECEAE3" opacity="0.35" letter-spacing="3">001 / BRAND IDENTITY / 2026 / NEON ROOTS STUDIO</text>
</svg>
